name: Build LayoutFixer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xclip

      - name: Install Python packages
        run: pip install pynput pyperclip pyinstaller

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: pyinstaller --onefile --windowed --name LayoutFixer layout_fixer.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name LayoutFixer layout_fixer.py
          cd dist && zip -r LayoutFixer-mac.zip LayoutFixer.app

      - name: Upload (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LayoutFixer-${{ runner.os }}
          path: dist/LayoutFixer*

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LayoutFixer-macOS
          path: dist/LayoutFixer-mac.zip
